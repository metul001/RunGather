project_id = "bangladesh-event-platform"
[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000
[db]
port = 54322
major_version = 17
[auth]
enabled = true
site_url = "rungather://auth/callback"
additional_redirect_urls = ["rungather://auth/callback", "rungather://auth/reset"]
minimum_password_length = 12
[auth.email]
enable_signup = true
enable_confirmations = true
[auth.mfa]
max_enrolled_factors = 5
[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true
[functions.upload-image]
verify_jwt = false
[functions.push-dispatch]
verify_jwt = false
